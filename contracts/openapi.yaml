openapi: 3.1.0
info:
  title: Zero Defect Space API
  description: Contract specification for quality-control events and controller decisions
  version: 1.0.0
paths:
  /health:
    get:
      summary: Healthcheck
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/me:
    get:
      summary: Get role of current token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user role
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role:
                    type: string
                    enum: [viewer, controller, admin, source]
  /api/events:
    post:
      summary: Ingest a raw quality control event
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/IngestionEventV1'
                - $ref: '#/components/schemas/IngestionEventV2'
      responses:
        '202':
          description: Accepted or duplicate event
          content:
            application/json:
              schema:
                type: object
                required: [ingestion_id, state]
                properties:
                  ingestion_id:
                    type: string
                  state:
                    type: string
                    enum: [applied, duplicate, quarantined, conflict]
                  reason:
                    type: string
        '409':
          description: Conflict (same source_id/event_id with different payload)
  /api/cases/{case_id}/decisions:
    post:
      summary: Record controller decision
      security:
        - BearerAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControllerDecisionRequest'
      responses:
        '201':
          description: Decision created
        '409':
          description: Stale version or conflict
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    IngestionEventV1:
      $ref: './event-v1.schema.json'
    IngestionEventV2:
      $ref: './event-v2.schema.json'
    ControllerDecisionRequest:
      type: object
      required:
        - action
        - actor
        - reason
        - expected_version
        - idempotency_key
      properties:
        action:
          type: string
          enum: [confirmed, rejected, needs_more_inspection]
        actor:
          type: string
        reason:
          type: string
        expected_version:
          type: integer
        idempotency_key:
          type: string
